<aside class="mp" id="mp" data-state="mini" aria-label="Hudební přehrávač">
  <audio id="mp-audio" preload="none"></audio>

  <div class="mp-mini mp-glass">
    <button class="mp-orb sm js-mp-play" type="button" aria-label="Přehrát hudbu">
      <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <canvas class="mp-mini-viz" aria-hidden="true"></canvas>
    <div class="mp-mini-title" aria-hidden="true"><span class="js-mp-mq"></span></div>
    <button class="mp-ic js-mp-open" type="button" aria-label="Rozbalit přehrávač" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
    </button>
  </div>

  <div class="mp-full mp-glass" role="region" aria-label="Přehrávač">
    <div class="mp-top">
      <span class="lbl">now playing</span>
      <span class="ix js-mp-ix">1/3</span>
      <button class="mp-ic js-mp-close" type="button" aria-label="Zmenšit přehrávač">
        <svg viewBox="0 0 24 24"><path d="M6 17h12"/></svg>
      </button>
    </div>
    <div class="mp-screen">
      <canvas class="mp-viz" aria-hidden="true"></canvas>
      <div class="mp-meta"><b class="js-mp-title"></b><span class="js-mp-artist"></span></div>
    </div>
    <div class="mp-seek">
      <output class="js-mp-cur">0:00</output>
      <input class="mp-range js-mp-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Pozice ve skladbě">
      <output class="js-mp-dur">0:00</output>
    </div>
    <div class="mp-ctrl">
      <button class="mp-orb nav js-mp-prev" type="button" aria-label="Předchozí skladba"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM9.5 12L19 5v14z"/></svg></button>
      <button class="mp-orb js-mp-play" type="button" aria-label="Přehrát hudbu">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button class="mp-orb nav js-mp-next" type="button" aria-label="Další skladba"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM14.5 12L5 19V5z"/></svg></button>
      <div class="mp-vol">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3zM15 8.5a5 5 0 010 7l-1.2-1.2a3.3 3.3 0 000-4.6zM17.6 6a8.6 8.6 0 010 12l-1.2-1.2a6.9 6.9 0 000-9.6z"/></svg>
        <input class="mp-range js-mp-vol" type="range" min="0" max="100" value="85" aria-label="Hlasitost">
      </div>
    </div>
    <ol class="mp-list js-mp-list"></ol>
  </div>
</aside>
